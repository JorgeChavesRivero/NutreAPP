spring.application.name=NutreAPP

# Configurar el puerto del servidor de pruebas
server.port=8080

# Configurar la conexion hacia la BD
spring.datasource.url=jdbc:h2:mem:nutreapp_bd
spring.datasource.username=sa
spring.datasource.password=

# Configurar el JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true